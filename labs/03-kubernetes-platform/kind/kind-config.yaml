# Temporary local Kubernetes cluster for Lab 03.
# Created with: kind create cluster --config kind/kind-config.yaml \
#                 --kubeconfig kind/kubeconfig --name modernops-lab03
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: modernops-lab03
nodes:
  - role: control-plane
    image: kindest/node:v1.33.12
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
